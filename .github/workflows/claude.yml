name: Claude Code

# Deliberately inline, where the other eight repositories call
# idun-corp/github-actions/.github/workflows/claude.yml@v1 (OSUI-4800).
#
# That repository is private with its Actions access set to "organization", and this one is public,
# so the reference does not resolve - the run fails before any job starts, with no jobs and no
# check run to look at:
#
#   error parsing called workflow ".github/workflows/claude.yml"
#    -> "idun-corp/github-actions/.github/workflows/claude.yml@v1" : workflow was not found
#
# This file therefore has to be kept in step with the shared one by hand. It is a copy of it, with
# the triggers and the mention gate that every caller owns anyway.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Load-bearing: the action exchanges this for a GitHub App installation token and posts as
      # claude[bot] with that, not with GITHUB_TOKEN.
      id-token: write
      # Lets Claude read CI results on pull requests. It pairs with additional_permissions below -
      # the grant here is what makes that request mean anything.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
