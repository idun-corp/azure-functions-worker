name: Claude Code Review

# Deliberately inline - see the header of claude.yml for why this repository cannot call
# idun-corp/github-actions (OSUI-4800). Keep it in step with the shared workflow by hand.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write matches the shared workflow's template, and is not what makes --comment work: the
      # action posts as claude[bot] through a GitHub App token it gets by exchanging the OIDC
      # token below. Reviews posted fine here under read.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # --comment posts the findings on the pull request. Without it a review still runs and
          # still costs, and the output reaches the run log only.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
