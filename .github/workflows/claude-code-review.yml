name: Claude Code Review

# Body in idun-corp/github-actions (OSUI-4796).
#
# `pull-requests: write` is required, not optional: the shared workflow passes `--comment`, and a
# called workflow cannot widen the token - `read` here leaves the review running and posting
# nothing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    uses: idun-corp/github-actions/.github/workflows/claude-code-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    secrets: inherit
